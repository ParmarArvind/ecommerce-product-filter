<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Filter</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="app">


        <!-- =========================================
             SIDEBAR FILTER PANEL
        ========================================== -->

        <aside
            class="sidebar"
            aria-label="Product filters"
        >

            <!-- Sidebar Header -->

            <div class="sidebar-header">

                <h2>Filters</h2>

                <button
                    type="button"
                    id="resetBtn"
                    class="reset-btn"
                >
                    Reset
                </button>

            </div>


            <!-- =====================================
                 CATEGORY FILTER
            ====================================== -->

            <section
                class="filter-section"
                aria-labelledby="categoryTitle"
            >

                <h3 id="categoryTitle">
                    Category
                </h3>


                <div class="category-list">

                    <label class="checkbox-item">

                        <input
                            type="checkbox"
                            class="category-filter"
                            value="Electronics"
                        >

                        <span>
                            Electronics
                        </span>

                    </label>


                    <label class="checkbox-item">

                        <input
                            type="checkbox"
                            class="category-filter"
                            value="Apparel"
                        >

                        <span>
                            Apparel
                        </span>

                    </label>


                    <label class="checkbox-item">

                        <input
                            type="checkbox"
                            class="category-filter"
                            value="Footwear"
                        >

                        <span>
                            Footwear
                        </span>

                    </label>

                </div>

            </section>



            <!-- =====================================
                 PRICE RANGE FILTER
            ====================================== -->

            <section
                class="filter-section"
                aria-labelledby="priceTitle"
            >

                <h3 id="priceTitle">
                    Price Range
                </h3>


                <!-- Selected price values -->

                <div class="price-values">

                    <span id="minPriceText">
                        ₹0
                    </span>

                    <span id="maxPriceText">
                        ₹5000
                    </span>

                </div>


                <!-- Dual range slider -->

                <div
                    class="range-container"
                    aria-label="Price range"
                >

                    <!-- Background track -->

                    <div class="range-track"></div>


                    <!-- Selected range -->

                    <div
                        id="rangeProgress"
                        class="range-progress"
                    ></div>


                    <!-- Minimum price -->

                    <input
                        type="range"
                        id="minPrice"
                        class="price-slider min-price"
                        min="0"
                        max="5000"
                        value="0"
                        step="100"
                        aria-label="Minimum price"
                    >


                    <!-- Maximum price -->

                    <input
                        type="range"
                        id="maxPrice"
                        class="price-slider max-price"
                        min="0"
                        max="5000"
                        value="5000"
                        step="100"
                        aria-label="Maximum price"
                    >

                </div>

            </section>



            <!-- =====================================
                 MINIMUM RATING FILTER
            ====================================== -->

            <section
                class="filter-section"
                aria-labelledby="ratingTitle"
            >

                <h3 id="ratingTitle">
                    Minimum Rating
                </h3>


                <div class="rating-list">


                    <!-- 1 Star -->

                    <label class="rating-option">

                        <input
                            type="radio"
                            name="rating"
                            value="1"
                        >

                        <span class="stars">
                            ★
                        </span>

                        <span class="rating-text">
                            & above
                        </span>

                    </label>



                    <!-- 2 Stars -->

                    <label class="rating-option">

                        <input
                            type="radio"
                            name="rating"
                            value="2"
                        >

                        <span class="stars">
                            ★★
                        </span>

                        <span class="rating-text">
                            & above
                        </span>

                    </label>



                    <!-- 3 Stars -->

                    <label class="rating-option">

                        <input
                            type="radio"
                            name="rating"
                            value="3"
                        >

                        <span class="stars">
                            ★★★
                        </span>

                        <span class="rating-text">
                            & above
                        </span>

                    </label>



                    <!-- 4 Stars -->

                    <label class="rating-option">

                        <input
                            type="radio"
                            name="rating"
                            value="4"
                        >

                        <span class="stars">
                            ★★★★
                        </span>

                        <span class="rating-text">
                            & above
                        </span>

                    </label>



                    <!-- 5 Stars -->

                    <label class="rating-option">

                        <input
                            type="radio"
                            name="rating"
                            value="5"
                        >

                        <span class="stars">
                            ★★★★★
                        </span>

                        <span class="rating-text">
                            & above
                        </span>

                    </label>

                </div>

            </section>

        </aside>



        <!-- =========================================
             MAIN PRODUCT CONTENT
        ========================================== -->

        <main class="main-content">


            <!-- Product Header -->

            <header class="products-header">

                <div>

                    <h1>
                        Product Inventory
                    </h1>

                    <p id="productCount">
                        0 products
                    </p>

                </div>

            </header>



            <!-- =====================================
                 PRODUCT GRID
            ====================================== -->

            <section
                id="productGrid"
                class="product-grid"
                aria-label="Product inventory"
            >

                <!-- Product cards generated by JS -->

            </section>



            <!-- =====================================
                 EMPTY STATE
            ====================================== -->

            <section
                id="emptyState"
                class="empty-state"
                aria-live="polite"
            >

                <div class="empty-icon">
                    🛍️
                </div>


                <h2>
                    No items match your criteria
                </h2>


                <p>
                    Try changing your filters to
                    find more products.
                </p>


                <button
                    type="button"
                    id="emptyResetBtn"
                    class="reset-large-btn"
                >
                    Reset filters
                </button>

            </section>

        </main>

    </div>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
